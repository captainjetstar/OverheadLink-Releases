name: Build and publish OverheadLink

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: overheadlink-release
  cancel-in-progress: true

jobs:
  release:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Download embedded runtimes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor | Out-Null
          python -m pip install pillow
          Invoke-WebRequest https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe -OutFile vendor/python-3.12.10-amd64.exe
          python -m pip download pyserial==3.5 --no-deps --dest vendor
          python -m pip download SimConnect==0.4.26 --no-deps --dest vendor/simconnect-package
          python -c "import pathlib,zipfile; wheel=next(pathlib.Path('vendor/simconnect-package').glob('*.whl')); z=zipfile.ZipFile(wheel); member=next(n for n in z.namelist() if n.endswith('/SimConnect.dll')); pathlib.Path('vendor/SimConnect.dll').write_bytes(z.read(member))"

      - name: Compile Python sources
        run: python -m compileall -q src tests run_overheadlink.py installer/prepare_bootstrap.py

      - name: Test
        run: python -m unittest discover -s tests -v

      - uses: arduino/setup-arduino-cli@v2
      - name: Install Arduino AVR core and firmware libraries
        shell: pwsh
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install "Adafruit NeoPixel"

      - name: Build bundled controller firmware and flasher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force firmware/precompiled/mega | Out-Null
          New-Item -ItemType Directory -Force firmware/precompiled/nano | Out-Null
          arduino-cli compile --fqbn arduino:avr:mega --output-dir firmware/precompiled/mega firmware/OverheadLinkMega
          arduino-cli compile --fqbn arduino:avr:nano:cpu=atmega328old --output-dir firmware/precompiled/nano firmware/OverheadLinkBacklightNano
          $AvrRoot = Get-ChildItem "$env:LOCALAPPDATA/Arduino15/packages/arduino/tools/avrdude" -Directory | Sort-Object Name | Select-Object -Last 1
          if (-not $AvrRoot) { throw "Arduino avrdude tool was not installed" }
          New-Item -ItemType Directory -Force vendor/avrdude | Out-Null
          Copy-Item "$($AvrRoot.FullName)/*" vendor/avrdude -Recurse -Force
          if (-not (Test-Path vendor/avrdude/bin/avrdude.exe)) { throw "Bundled avrdude.exe was not found after copy" }
          if (-not (Test-Path vendor/avrdude/etc/avrdude.conf)) { throw "Bundled avrdude.conf was not found after copy" }

      - name: Build native setup launcher
        shell: cmd
        run: |
          python installer\prepare_bootstrap.py || exit /b 1
          python installer\generate_icon.py || exit /b 1
          rc /nologo /fo installer\overheadlink.res installer\bootstrap.rc || exit /b 1
          cl /nologo /O2 /W3 /DUNICODE /D_UNICODE /MT /Fo:installer\bootstrap.obj /c installer\bootstrap_build.c || exit /b 1
          link /nologo /SUBSYSTEM:WINDOWS /OUT:installer\OverheadLink_base.exe installer\bootstrap.obj installer\overheadlink.res bcrypt.lib shell32.lib ole32.lib comctl32.lib user32.lib gdi32.lib advapi32.lib || exit /b 1

      - name: Package one-file executable
        shell: pwsh
        run: |
          $Version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $Name = "OverheadLink_v${Version}_Windows_x64.exe"
          python installer/package_executable.py installer/OverheadLink_base.exe . $Name
          python installer/verify_executable.py $Name
          $Hash = (Get-FileHash $Name -Algorithm SHA256).Hash.ToLower()
          "$Hash  $Name" | Set-Content -NoNewline -Encoding ascii "$Name.sha256"
          "VERSION=$Version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ASSET=$Name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Tag = "v$env:VERSION"
          if (gh release view $Tag 2>$null) {
            gh release upload $Tag $env:ASSET "$env:ASSET.sha256" --clobber
          } else {
            gh release create $Tag $env:ASSET "$env:ASSET.sha256" --title "OverheadLink $Tag" --notes-file RELEASE_NOTES_0311.md --latest
          }

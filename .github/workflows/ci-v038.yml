name: Validate OverheadLink v0.3.8

on:
  push:
    branches: [overheadlink-0.3.8-tm1637-cleanup]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runtime
        shell: bash
        run: |
          python -m pip install pyserial==3.5
          mkdir -p vendor/simconnect-package
          python -m pip download SimConnect==0.4.26 --no-deps --dest vendor/simconnect-package
          python -c "import pathlib,zipfile; wheel=next(pathlib.Path('vendor/simconnect-package').glob('*.whl')); z=zipfile.ZipFile(wheel); member=next(n for n in z.namelist() if n.endswith('/SimConnect.dll')); pathlib.Path('vendor/SimConnect.dll').write_bytes(z.read(member))"
      - name: Compile Python sources
        run: python -m compileall -q src tests run_overheadlink.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - uses: arduino/setup-arduino-cli@v2
      - name: Install Arduino AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
      - name: Compile Mega firmware
        run: arduino-cli compile --fqbn arduino:avr:mega firmware/OverheadLinkMega

name: Validate OverheadLink v0.3.8

on:
  push:
    branches: [overheadlink-0.3.8-tm1637-cleanup]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runtime
        run: python -m pip install pyserial==3.5
      - name: Compile Python sources
        run: python -m compileall -q src tests run_overheadlink.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
